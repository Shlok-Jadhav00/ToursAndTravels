plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.toursandtravels'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.toursandtravels"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'com.github.denzcoskun:ImageSlideshow:0.1.2'
    implementation 'com.android.volley:volley:1.2.1'


    implementation "androidx.fragment:fragment:1.6.2"
    implementation 'com.mappls.sdk:place-widget:2.2.0'
    implementation 'com.mappls.sdk:mappls-android-sdk:8.1.3'
    implementation 'com.mappls.sdk:direction-ui:1.0.0'

    //for location
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:17.0.1'
    implementation 'com.mappls.sdk:annotation-plugin:1.0.1'

    //Geoanalytics plugin
    implementation 'com.mappls.sdk:geoanalytics-plugin:1.1.0'

    implementation 'com.mappls.sdk:markerview-plugin:1.0.1'
    //for location
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'

}